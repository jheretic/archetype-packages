# Default miz VENDOR configuration for Archetype Linux.
#
# This file ships in the immutable /usr at /usr/lib/miz/miz.toml. miz loads it
# as the base layer and merges an OPTIONAL user override at /etc/miz.toml on top
# (user keys win per-key; [[repos]] merge by name). It does not fall back to
# pacman.conf. The [archetype] repository + date-pinned archive servers are
# baked into this file at image-build time by archetype-build's mkosi.postinst,
# pinned to the build's package date. Carrying repos in /usr (not /etc) lets an
# A/B update bring matching repos automatically: the -Iu relay mounts the new
# /usr into the root snapshot, so -Syu resolves against the new version's repos.
#
# Schema reference: miz's crates/miz/examples/miz.toml. Unknown keys are
# ignored for forward compatibility.

[options]
# pacman stays installed because miz dynamically links libalpm.so (shipped by
# the pacman package). Hold it so it is never auto-removed.
hold_pkg = ["pacman"]
architecture = ["auto"]

# Verify signatures by default; the archetype keyring is populated at build
# time. Matches the image's /etc/pacman.conf SigLevel.
sig_level = ["Required", "DatabaseOptional"]
local_file_sig_level = ["Optional"]
remote_file_sig_level = ["Required"]

parallel_downloads = 5
check_space = true

# Colorize output by default on Archetype. miz's built-in default is off (a bare
# miz.toml stays uncolored); this vendor config turns it on. Respects NO_COLOR
# and only applies when the output is a TTY.
color = true

# ---- repositories ----
# Order matters: first match wins. mkosi.postinst appends [archetype] after
# these (matching how it appends [archetype] to the end of pacman.conf), so
# core/extra take precedence -- archetype only supplies packages Arch doesn't.

[[repos]]
name = "core"
servers = ["https://geo.mirror.pkgbuild.com/$repo/os/$arch"]

[[repos]]
name = "extra"
servers = ["https://geo.mirror.pkgbuild.com/$repo/os/$arch"]
